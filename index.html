<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooking every dish in Dinner</title>
<meta name="description" content="Cooking every dish in Dinner by @recipetineater: live progress tracker.">
<script>
  // Live data: public Google Sheet, "Public" tab, as CSV.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1f557VxAxSyOM9xvwQzXwrZx2TLdZa1gD2oo1UwQ-5FI/gviz/tq?tqx=out:csv&sheet=Public";
  // Votes: URL of the deployed Cloudflare Worker in worker/ (leave empty to hide voting).
  const VOTE_URL = "";
  // Chapters of the book, with the page each one starts on.
  const CHAPTERS = [
    [1, "Everyday Food"],
    [52, "Effortless"],
    [92, "Stir-fries & Noodles"],
    [126, "What Do I Do With a Piece Of…"],
    [148, "Pasta & Cosy Food"],
    [180, "Meal-worthy Salads"],
    [196, "Mexican Food"],
    [226, "Asian Bites & Soups"],
    [248, "Bigger Things"],
    [299, "Sweet Endings"],
    [322, "Everything Else You Need"],
  ];
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #2a2522; --muted: #7a706a;
    --line: #ece5dc; --accent: #c2502a; --accent-soft: #fbe9e2; --ok: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1715; --card: #24201d; --text: #f0ebe6; --muted: #a69c94;
      --line: #3a342f; --accent: #ec7a52; --accent-soft: #3a2620; --ok: #6cc28f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0; font-size: 1.7rem; line-height: 1.2; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 20px; color: var(--muted); }
  .sub a { color: var(--accent); text-decoration: none; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 0.85rem; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s ease; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .controls input[type=search], .controls select {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  .controls input[type=search] { flex: 1 1 240px; min-width: 0; }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .count { color: var(--muted); font-size: 0.85rem; margin-left: auto; }

  .table-wrap {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    overflow: auto; max-height: 75vh;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th {
    position: sticky; top: 0; background: var(--card); z-index: 1;
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    box-shadow: inset 0 -1px 0 var(--line);
  }
  tr:last-child td { border-bottom: 0; }
  td.num { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.dish { font-weight: 500; min-width: 180px; }
  td.chapter { color: var(--muted); white-space: nowrap; }
  td.tick { color: var(--ok); font-weight: 700; text-align: center; }
  td.date, td.rating { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .links a {
    display: inline-block; margin: 0 4px 4px 0; padding: 1px 7px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); font-size: 0.78rem; font-weight: 600; text-decoration: none;
  }
  .links a:hover { text-decoration: underline; }
  td.photo { width: 1%; padding-right: 4px; }
  .thumb {
    display: block; width: 64px; height: 64px; border-radius: 8px;
    background: var(--line); object-fit: cover;
  }
  a.thumb-link { display: block; border-radius: 8px; }
  a.thumb-link:hover .thumb { opacity: 0.85; }
  td.votes { white-space: nowrap; }
  button.vote {
    font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 99px; padding: 3px 10px;
  }
  button.vote:hover:not(:disabled) { filter: brightness(0.95); }
  button.vote:disabled { cursor: default; opacity: 0.5; }
  .no-votes .votes { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .msg { padding: 28px; text-align: center; color: var(--muted); }

  @media (max-width: 640px) {
    h1 { font-size: 1.4rem; }
    .count { margin-left: 0; width: 100%; }
    th, td { padding: 8px 7px; font-size: 0.88rem; }
    .hide-sm { display: none; }
    .thumb { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cooking every dish in Dinner</h1>
  <p class="sub">The cookbook by <a href="https://www.instagram.com/recipetineater/" target="_blank" rel="noopener">@recipetineater</a>, one dish at a time.</p>

  <div class="stats">
    <div class="stat"><b id="s-posted">–</b><span>posted</span></div>
    <div class="stat"><b id="s-left">–</b><span>remaining</span></div>
    <div class="stat"><b id="s-pct">–</b><span>complete</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="controls">
    <input id="q" type="search" placeholder="Search dish, chapter or page…" aria-label="Search">
    <select id="chapter" aria-label="Chapter"><option value="">All chapters</option></select>
    <label><input id="posted" type="checkbox"> Posted only</label>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><span class="sr-only">Photo</span></th><th>#</th><th class="hide-sm">Page</th><th class="hide-sm">Chapter</th><th>Dish</th>
          <th>Posted</th><th>Date</th><th>Rating</th><th>Links</th><th class="votes">Vote</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="10" class="msg">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const TICK = "✓";
  let dishes = [];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const done = (v) => String(v ?? "").trim() === TICK;
  const chapterOf = (page) => (CHAPTERS.filter(([start]) => Number(page) >= start).pop() || CHAPTERS[0])[1];

  let votes = {};          // dish # -> vote count
  let votesLeft = null;    // votes this visitor has left, once known

  // Pull every URL out of a "Post link" cell, e.g. "IG https://… | Reddit reddit.com/…"
  function extractLinks(cell) {
    const found = String(cell ?? "").match(/(?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}\/[^\s|]*/gi) || [];
    return found.map((raw) => {
      const url = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
      const host = url.replace(/^https?:\/\/(www\.)?/i, "").toLowerCase();
      let label = "Link";
      if (host.startsWith("instagram.com")) label = host.includes("/reel/") ? "Reel" : "IG";
      else if (host.startsWith("reddit.com")) label = "Reddit";
      return { url, label };
    });
  }

  // Square thumbnail (or same-size placeholder); clicks through to the first IG link.
  function thumb(d) {
    if (!d.photo) return `<span class="thumb"></span>`;
    const img = `<img class="thumb" src="${esc(d.photo)}" alt="${esc(d.dish)}" loading="lazy">`;
    const ig = d.links.find((l) => l.url.includes("instagram.com"));
    return ig ? `<a class="thumb-link" href="${esc(ig.url)}" target="_blank" rel="noopener">${img}</a>` : img;
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const chapter = $("chapter").value;
    const postedOnly = $("posted").checked;

    const shown = dishes.filter((d) =>
      (!chapter || d.chapter === chapter) &&
      (!postedOnly || d.posted) &&
      (!q || d.dish.toLowerCase().includes(q) || d.chapter.toLowerCase().includes(q) || d.page.toLowerCase().includes(q))
    );

    const left = votesLeft === null ? "" : ` · ${votesLeft} vote${votesLeft === 1 ? "" : "s"} left`;
    $("count").textContent = `${shown.length} of ${dishes.length} dishes${left}`;
    $("rows").innerHTML = shown.length ? shown.map((d) => `
      <tr>
        <td class="photo">${thumb(d)}</td>
        <td class="num">${esc(d.n)}</td>
        <td class="num hide-sm">${esc(d.page)}</td>
        <td class="chapter hide-sm">${esc(d.chapter)}</td>
        <td class="dish">${esc(d.dish)}</td>
        <td class="tick">${d.posted ? TICK : ""}</td>
        <td class="date">${esc(d.date)}</td>
        <td class="rating">${esc(d.rating)}</td>
        <td class="links">${d.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${l.label}</a>`).join("")}</td>
        <td class="votes">${voteButton(d)}</td>
      </tr>`).join("") : `<tr><td colspan="10" class="msg">No dishes match.</td></tr>`;
  }

  // Voting is only open on dishes that haven't been posted yet.
  function voteButton(d) {
    if (d.posted) return "";
    const off = votesLeft === 0 ? " disabled" : "";
    return `<button class="vote" data-n="${esc(d.n)}" title="Vote for this dish next"${off}>▲ ${votes[d.n] || 0}</button>`;
  }

  async function loadVotes() {
    try {
      const data = await (await fetch(VOTE_URL)).json();
      votes = data.votes || {};
      votesLeft = data.remaining ?? null;
      render();
    } catch {}
  }

  async function vote(n) {
    try {
      const r = await fetch(VOTE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dish: n }) });
      const data = await r.json();
      if (r.status === 429) { votesLeft = 0; render(); return; }
      if (!r.ok) throw new Error(data.error);
      votes[n] = data.votes;
      votesLeft = data.remaining;
      render();
    } catch {
      alert("Couldn't register your vote. Please try again.");
    }
  }

  function summarise() {
    const total = dishes.length;
    const cooked = dishes.filter((d) => d.cooked).length;
    const posted = dishes.filter((d) => d.posted).length;
    const pct = total ? (cooked / total) * 100 : 0;
    $("s-posted").textContent = posted;
    $("s-left").textContent = total - cooked;
    $("s-pct").textContent = pct.toFixed(1) + "%";
    $("bar").style.width = pct + "%";
  }

  function load() {
    // Cache-buster so a reload always asks Google for the latest sheet.
    const url = CSV_URL + "&_=" + Date.now();
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: ({ data }) => {
        dishes = data
          .filter((r) => (r["Dish"] || "").trim())
          .map((r) => ({
            n: (r["#"] || "").trim(),
            page: (r["Page"] || "").trim(),
            chapter: chapterOf((r["Page"] || "").trim()),
            dish: (r["Dish"] || "").trim(),
            cooked: done(r["Cooked"]),
            posted: done(r["Posted"]),
            date: (r["Date posted"] || "").trim(),
            rating: (r["Rating"] || "").trim(),
            links: extractLinks(r["Post link"]),
            photo: (r["Photo URL"] || "").trim(),
          }));

        const present = new Set(dishes.map((d) => d.chapter));
        $("chapter").insertAdjacentHTML("beforeend", CHAPTERS.filter(([, c]) => present.has(c)).map(([, c]) => `<option>${esc(c)}</option>`).join(""));

        summarise();
        render();
      },
      error: () => {
        $("rows").innerHTML = `<tr><td colspan="10" class="msg">Couldn't load the tracker. Try reloading.</td></tr>`;
      },
    });
  }

  ["q", "chapter", "posted"].forEach((id) => $(id).addEventListener("input", render));
  $("rows").addEventListener("click", (e) => {
    const btn = e.target.closest("button.vote");
    if (btn) { btn.disabled = true; vote(btn.dataset.n); }
  });
  load();
  if (VOTE_URL) loadVotes(); else document.body.classList.add("no-votes");
</script>
</body>
</html>
